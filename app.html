<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>triz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Concepto: una pantalla, una decisión. Papel azulado frío, un solo azul de acento, y el color de la pastilla como señal principal.
   Tipo: Atkinson Hyperlegible (diseñada para baja visión) en todo; monoespaciada del sistema solo para los mensajes de los dispositivos. */
:root{
  --bg:#F2F5F8; --surface:#FFFFFF; --ink:#10202C; --quiet:#46586A; --line:#D3DCE4; --wash:#E6EEF5;
  --accent:#0A5C9E; --on-accent:#FFFFFF;
  --ok:#1B7A4B; --ok-bg:#E3F3EA; --warn:#8F5200; --warn-bg:#FBEBD3; --crit:#B3261E; --crit-bg:#FBE4E1;
  --font:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E161D; --surface:#16222B; --ink:#EAF1F6; --quiet:#A3B5C3; --line:#2B3C48; --wash:#1D2C37;
    --accent:#7DBDF5; --on-accent:#0E161D;
    --ok:#62D096; --ok-bg:#163326; --warn:#F2B755; --warn-bg:#3A2A10; --crit:#FF8F86; --crit-bg:#3F1B18;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E161D; --surface:#16222B; --ink:#EAF1F6; --quiet:#A3B5C3; --line:#2B3C48; --wash:#1D2C37;
  --accent:#7DBDF5; --on-accent:#0E161D;
  --ok:#62D096; --ok-bg:#163326; --warn:#F2B755; --warn-bg:#3A2A10; --crit:#FF8F86; --crit-bg:#3F1B18;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:400 20px/1.5 var(--font); -webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 56px;
}
.wrap{max-width:760px; margin:0 auto; display:grid; gap:20px}
header{display:grid; gap:14px}
.brand{margin:0; display:flex; align-items:center; gap:14px; font:700 32px/1 var(--font); letter-spacing:.01em}
.mark{width:42px; height:19px; border:3px solid var(--accent); border-radius:12px; background:linear-gradient(90deg,var(--accent) 50%,var(--surface) 50%); transform:rotate(-24deg)}
nav{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
nav a{display:grid; place-items:center; min-height:60px; padding:6px 8px; border-radius:12px; border:2px solid var(--line); background:var(--surface); color:var(--ink); font-weight:700; font-size:18px; line-height:1.2; text-align:center; text-decoration:none}
nav a[aria-current="page"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
:focus-visible{outline:4px solid var(--ink); outline-offset:3px}
main{display:grid; gap:20px; min-width:0}

h1{margin:0; font:700 34px/1.2 var(--font); text-wrap:balance}
h2{margin:0 0 12px; font:700 26px/1.25 var(--font)}
p{margin:0}
.quiet{color:var(--quiet)}
.eyebrow{margin:0 0 10px; font:700 17px/1.3 var(--font); letter-spacing:.08em; text-transform:uppercase; color:var(--quiet)}
.card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:22px; min-width:0}
.card.alarm{border:3px solid var(--accent)}
.card.done{background:var(--ok-bg); border-color:var(--ok)}
.card.done h1,.card.done p{color:var(--ok)}
.card.note{background:var(--warn-bg); border-color:var(--warn); display:grid; gap:12px}
.card.note p{color:var(--warn)}
.card.stack{display:grid; gap:16px}
.card.done,.card.crit,.card.alarm:not(.stack){display:grid; gap:8px}
.card.crit{background:var(--crit-bg); border:3px solid var(--crit)}
.card.crit h1,.card.crit p{color:var(--crit)}
.card.note h1{color:var(--warn)}
.doses .acts{grid-column:2/-1; display:flex; gap:10px; flex-wrap:wrap}

.pillrow{display:flex; gap:22px; align-items:center; flex-wrap:wrap}
.pill{width:124px; height:124px; flex:none; border-radius:50%; background:var(--c); color:var(--ci); border:3px solid var(--ink); display:grid; place-items:center; font:700 56px/1 var(--font)}
.big-sub{font-size:24px; margin-top:6px}
.hint{font-size:22px}
.levels{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.levels i{height:14px; border-radius:7px; background:var(--line)}
.levels i.on{background:var(--accent)}
.levels i.on.l4{background:var(--crit)}

button{font-family:var(--font)}
.big{display:block; width:100%; min-height:104px; padding:12px 20px; border:0; border-radius:18px; background:var(--accent); color:var(--on-accent); font:700 32px/1.2 var(--font); cursor:pointer}
.big:active{transform:scale(.985)}
.btn{min-height:56px; padding:8px 20px; border-radius:12px; border:2px solid var(--accent); background:transparent; color:var(--accent); font:700 19px/1.2 var(--font); cursor:pointer}
.btn.solid{background:var(--accent); color:var(--on-accent)}
.btn.danger{border-color:var(--crit); color:var(--crit)}
.btn.danger.armed{background:var(--crit); color:var(--surface)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.row{display:flex; gap:12px; flex-wrap:wrap; align-items:center}

.chip{display:inline-block; padding:2px 12px; border-radius:999px; font-size:17px; font-weight:700; line-height:1.5; white-space:nowrap}
.chip.ok{background:var(--ok-bg); color:var(--ok)}
.chip.warn{background:var(--warn-bg); color:var(--warn)}
.chip.crit{background:var(--crit-bg); color:var(--crit)}
.chip.quiet{background:var(--wash); color:var(--quiet)}
.chip.accent{background:var(--accent); color:var(--on-accent)}

.doses{list-style:none; margin:0; padding:0}
.doses li{display:grid; grid-template-columns:20px 6.2em minmax(0,1fr) auto; gap:12px; align-items:center; padding:12px 0; border-top:1px solid var(--line)}
.doses li:first-child{border-top:0}
.dot{width:20px; height:20px; border-radius:50%; background:var(--c); border:2px solid var(--quiet)}
.doses .t{font-variant-numeric:tabular-nums; font-weight:700}
.doses .n{overflow-wrap:anywhere}

.dense{font-size:18px}
.scroll{overflow-x:auto}
table{width:100%; min-width:560px; border-collapse:collapse; font-size:18px; font-variant-numeric:tabular-nums}
th,td{padding:10px 12px; text-align:left; border-top:1px solid var(--line); vertical-align:top}
th{font-size:16px; font-weight:700; color:var(--quiet); letter-spacing:.04em; border-top:0}
td .dot{display:inline-block; vertical-align:-3px; margin-right:8px}

.sum{display:flex; gap:10px; flex-wrap:wrap}
.alerts{list-style:none; margin:0; padding:0}
.alerts li{display:grid; grid-template-columns:auto minmax(0,1fr); gap:6px 14px; padding:12px 0; border-top:1px solid var(--line)}
.alerts li:first-child{border-top:0}
.alerts .when{grid-column:2; font-size:16px; color:var(--quiet)}

form{display:grid; gap:14px}
label,legend{font-weight:700; font-size:18px}
.field{display:grid; gap:6px}
input[type=text],input[type=number],select{width:100%; min-height:56px; padding:8px 14px; border:2px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); font:400 20px/1.3 var(--font)}
fieldset{margin:0; padding:0; border:0; min-width:0}
.swatches{display:flex; flex-wrap:wrap; gap:10px; margin-top:8px}
.sw{position:relative; display:grid; justify-items:center; gap:4px; font-size:15px; font-weight:400; min-width:64px}
.sw input{position:absolute; opacity:0; width:44px; height:44px; margin:0}
.sw .c{display:block; width:44px; height:44px; border-radius:50%; background:var(--c); border:2px solid var(--quiet)}
.sw .auto{display:grid; place-items:center; background:var(--wash); color:var(--ink); font-weight:700; font-size:15px}
.sw input:checked + .c{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--ink)}
.sw input:focus-visible + .c{outline:4px solid var(--ink); outline-offset:6px}
.sw input:disabled + .c{opacity:.3}
.two{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px}
.msg{min-height:1.5em; color:var(--crit); font-weight:700; font-size:18px}
.msg.good{color:var(--ok)}

.box{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px}
.lid{display:grid; gap:10px; padding:12px; border:2px solid var(--line); border-radius:12px; background:var(--surface); min-width:0}
.lid .cap{height:60px; border-radius:8px; background:var(--c); color:var(--ci); display:grid; place-items:center; font-weight:700; font-size:24px; border:2px solid var(--quiet); transition:transform .2s,opacity .2s}
.lid .name{font-size:17px; overflow-wrap:anywhere}
.lid.led{border-color:var(--c); animation:pulse 1.1s ease-in-out infinite}
.lid.open .cap{transform:translateY(-8px) rotate(-5deg); opacity:.55}
.band{display:flex; align-items:center; justify-content:center; gap:18px; width:min(100%,320px); height:92px; border-radius:46px; background:var(--wash); border:2px solid var(--line)}
.led{width:46px; height:46px; border-radius:50%; background:var(--c,var(--line)); border:2px solid var(--quiet); box-shadow:0 0 22px var(--c,transparent)}
.led.blink{animation:blink .6s steps(2,start) infinite}
.vib{font-size:17px; font-weight:700; color:var(--quiet)}
.vib.on{color:var(--accent); animation:shake .3s linear infinite}
.log{font:15px/1.6 var(--mono); background:var(--wash); border-radius:10px; padding:12px; max-height:280px; overflow:auto}
.log div{overflow-wrap:anywhere}
.log .tm{color:var(--quiet)}
.log .cloud{color:var(--accent)}
.sw-line{display:flex; gap:12px; align-items:center; min-height:56px}
.sw-line input{width:28px; height:28px; accent-color:var(--accent)}
.foot{font-size:17px; color:var(--quiet)}

@keyframes blink{50%{opacity:.15}}
@keyframes pulse{50%{box-shadow:0 0 0 7px var(--c)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
@media (max-width:420px){
  h1{font-size:30px}
  .pill{width:104px; height:104px; font-size:48px}
  .big{font-size:28px}
}
</style>

<div class="wrap">
  <header>
    <p class="brand"><span class="mark" aria-hidden="true"></span>triz</p>
    <nav aria-label="Secciones">
      <a href="#adulto">Adulto mayor</a>
      <a href="#cuidador">Cuidador</a>
      <a href="#equipos">Equipos</a>
    </nav>
  </header>
  <main id="view"></main>
  <p class="foot">Demostración: los datos quedan solo en este navegador. En el sistema completo, el escalado de la alarma y el registro corren en la nube.</p>
</div>

<script>
(function(){
'use strict';

/* ---------- Colores: uno por medicamento, con número de parpadeos para no depender solo del color ---------- */
var COLORS=[
  {id:'rojo',name:'Rojo',fem:'roja',hex:'#D64545',ink:'#FFFFFF',blinks:2},
  {id:'azul',name:'Azul',fem:'azul',hex:'#0072B2',ink:'#FFFFFF',blinks:1},
  {id:'verde',name:'Verde',fem:'verde',hex:'#009E73',ink:'#FFFFFF',blinks:3},
  {id:'amarillo',name:'Amarillo',fem:'amarilla',hex:'#F0E442',ink:'#1A1A1A',blinks:4},
  {id:'naranja',name:'Naranja',fem:'naranja',hex:'#E69F00',ink:'#1A1A1A',blinks:5},
  {id:'celeste',name:'Celeste',fem:'celeste',hex:'#56B4E9',ink:'#1A1A1A',blinks:6},
  {id:'morado',name:'Morado',fem:'morada',hex:'#7B5EA7',ink:'#FFFFFF',blinks:7},
  {id:'rosado',name:'Rosado',fem:'rosada',hex:'#CC79A7',ink:'#1A1A1A',blinks:8}
];
var LIMIT=8, STEP=2;   /* minutos: la alarma sube de nivel cada 2 y se cierra a los 8 */
var KEY='triz-demo-v1';

function byColor(id){for(var i=0;i<COLORS.length;i++){if(COLORS[i].id===id)return COLORS[i];}return COLORS[0];}
function $(s){return document.querySelector(s);}
function pad(n){return String(n).padStart(2,'0');}
function dayKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function clock(hhmm){var p=hhmm.split(':');return new Date(2000,0,1,+p[0],+p[1]).toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit'});}
function nowHHMM(){var n=new Date();return pad(n.getHours())+':'+pad(n.getMinutes());}
function dayLabel(ts){
  var d=new Date(ts),t=new Date(),k=dayKey(d);
  if(k===dayKey(t))return 'Hoy';
  if(k===dayKey(new Date(t.getFullYear(),t.getMonth(),t.getDate()-1)))return 'Ayer';
  return d.toLocaleDateString('es-CO',{day:'numeric',month:'short'});
}
function timeLabel(ts){return new Date(ts).toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit'});}
function daysLeft(m){return Math.floor(m.stock/(m.porToma*Math.max(1,m.horarios.length)));}

/* ---------- Estado y almacenamiento (solo este navegador) ---------- */
function seed(){
  var t=new Date(), y=new Date(t.getFullYear(),t.getMonth(),t.getDate()-1), yk=dayKey(y);
  var meds=[
    {id:'m1',nombre:'Losartán',dosis:'50 mg',color:'rojo',stock:24,porToma:1,umbral:6,horarios:['08:00','20:00']},
    {id:'m2',nombre:'Metformina',dosis:'850 mg',color:'azul',stock:18,porToma:1,umbral:6,horarios:['08:00','20:00']},
    {id:'m3',nombre:'Atorvastatina',dosis:'20 mg',color:'verde',stock:5,porToma:1,umbral:7,horarios:['21:00']}
  ];
  function mk(m,h,estado,conf,nota){
    var p=h.split(':');
    return {key:yk+'|'+m.id+'|'+h,date:yk,hhmm:h,medId:m.id,nombre:m.nombre,dosis:m.dosis,color:m.color,estado:estado,confianza:conf,nota:nota,
      ts:new Date(y.getFullYear(),y.getMonth(),y.getDate(),+p[0],+p[1]).getTime()+90000};
  }
  var ev={};
  [mk(meds[0],'08:00','tomada','alta','Tapa y confirmación'),
   mk(meds[1],'08:00','tomada','alta','Tapa y confirmación'),
   mk(meds[0],'20:00','tomada','alta','Tapa y confirmación'),
   mk(meds[1],'20:00','omitida','sin evidencia','Sin tapa ni confirmación'),
   mk(meds[2],'21:00','tomada','baja','Tomada sin confirmar')].forEach(function(e){ev[e.key]=e;});
  var base=new Date(y.getFullYear(),y.getMonth(),y.getDate(),20,8).getTime();
  var alerts=[
    {id:'a1',ts:base,nivel:'urgente',texto:'Dosis omitida: Metformina 850 mg de las '+clock('20:00')+' (color azul).'},
    {id:'a2',ts:base+3600000,nivel:'aviso',texto:'Reponer Atorvastatina: quedan 5 y alcanzan para 5 días.'}
  ];
  return {meds:meds,events:ev,alerts:alerts,demo:true,seeded:true};
}
function load(){
  try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.meds&&o.events&&o.alerts)return o;}}catch(e){}
  return null;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

var S=load()||seed();
var session=null, lastResult=null, view='adulto', logLines=[], evCounter=1;
var soundOn=false, ac=null, wake=null, sndTimer=null, lastTs=Date.now();
var openUntil={}, wrongFlash=0, armDel=null, pendingRender=false, formNote='', simMed=S.meds.length?S.meds[0].id:'';

/* ---------- Horario de hoy ---------- */
function todayDoses(){
  var dk=dayKey(new Date()), out=[];
  S.meds.forEach(function(m){m.horarios.forEach(function(h){var key=dk+'|'+m.id+'|'+h;out.push({key:key,med:m,hhmm:h,ev:S.events[key]||null});});});
  out.sort(function(a,b){return a.hhmm.localeCompare(b.hhmm)||a.med.nombre.localeCompare(b.med.nombre);});
  return out;
}
function doseState(d){
  if(session&&session.key===d.key)return 'en curso';
  if(d.ev)return d.ev.estado;
  return d.hhmm>nowHHMM()?'pendiente':'sin_registro';
}
function needsCheck(d){
  var st=doseState(d);
  if(d.ev&&d.ev.manual)return false;
  return st==='sin_registro'||st==='omitida'||st==='error_color'||(st==='tomada'&&d.ev.confianza==='baja');
}
function nextDose(){
  var list=todayDoses().filter(function(d){return !d.ev&&d.hhmm>nowHHMM();});
  if(list.length)return {d:list[0],tomorrow:false};
  var all=[];
  S.meds.forEach(function(m){m.horarios.forEach(function(h){all.push({med:m,hhmm:h});});});
  all.sort(function(a,b){return a.hhmm.localeCompare(b.hhmm);});
  return all.length?{d:all[0],tomorrow:true}:null;
}

/* ---------- Regla de decisión (la misma tabla del documento de arquitectura) ---------- */
function decide(s,closed){
  if(s.lidOk&&s.confirmed)return {estado:'tomada',confianza:'alta',stock:true,nota:'Tapa y confirmación'};
  if(s.lidOk&&closed)return {estado:'tomada',confianza:'baja',stock:true,nota:'Tomada sin confirmar'};
  if(!s.lidOk&&s.confirmed)return {estado:'tomada',confianza:'baja',stock:false,revision:true,nota:'Confirmada sin evidencia del pastillero'};
  if(closed&&s.lidWrong)return {estado:'error_color',confianza:'sin evidencia',stock:false,nota:'Se abrió una tapa que no correspondía'};
  if(closed)return {estado:'omitida',confianza:'sin evidencia',stock:false,nota:'Sin tapa ni confirmación'};
  return null;
}

/* ---------- Mensajes de los dispositivos (como los temas MQTT del documento) ---------- */
function log(topic,payload,kind){
  logLines.unshift({t:new Date(),topic:topic,payload:payload?JSON.stringify(payload):'',kind:kind||'mqtt'});
  if(logLines.length>30)logLines.length=30;
}
function addAlert(nivel,texto){
  S.alerts.unshift({id:'a'+Date.now()+Math.random().toString(36).slice(2,5),ts:Date.now(),nivel:nivel,texto:texto});
  if(S.alerts.length>20)S.alerts.length=20;
}

/* ---------- Sonido, vibración y pantalla encendida ---------- */
function enableSound(){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.resume)ac.resume();
    soundOn=true;
    beep(660,0.12,0.05);
  }catch(e){soundOn=false;}
}
function beep(freq,dur,gain){
  if(!ac||!soundOn)return;
  try{
    var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
    o.type='sine';o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(gain,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+0.05);
  }catch(e){}
}
function burst(level){
  var g=[0.06,0.14,0.26,0.4][level-1], f=480+80*level, i;
  for(i=0;i<level;i++){(function(k){setTimeout(function(){beep(f,0.18,g);},k*260);})(i);}
}
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
function loopSound(){
  clearInterval(sndTimer);
  sndTimer=setInterval(function(){
    if(!session){clearInterval(sndTimer);return;}
    if(!session.quiet){burst(session.level);if(session.level>=2)vib(session.level>=3?[250,100,250]:[250]);}
  },1500);
  if(session&&!session.quiet)burst(session.level);
}
function getWake(){
  try{
    if(navigator.wakeLock&&!wake){
      navigator.wakeLock.request('screen').then(function(w){wake=w;w.addEventListener('release',function(){wake=null;});}).catch(function(){});
    }
  }catch(e){}
}
function releaseWake(){try{if(wake){wake.release();wake=null;}}catch(e){}}

/* ---------- Ciclo de una toma ---------- */
function startSession(med,hhmm,key,sim){
  if(session)return false;
  session={key:key,med:med,hhmm:hhmm,sim:!!sim,minute:0,level:1,lidOk:false,lidWrong:false,confirmed:false,quiet:false,
    id:'ev-'+String(evCounter++).padStart(4,'0')};
  lastResult=null;lastTs=Date.now();
  var c=byColor(med.color);
  log('triz/paciente/alarm/set',{event_id:session.id,color:c.hex,pattern:c.blinks,level:1});
  vib([300]);getWake();loopSound();render();
  return true;
}
function checkSchedule(){
  if(session)return;
  var dk=dayKey(new Date()),hm=nowHHMM(),i,j,m,h,key;
  for(i=0;i<S.meds.length;i++){
    m=S.meds[i];
    for(j=0;j<m.horarios.length;j++){
      h=m.horarios[j];
      if(h===hm){key=dk+'|'+m.id+'|'+h;if(!S.events[key]){startSession(m,h,key,false);return;}}
    }
  }
}
function simulate(){
  var m=null,i;
  for(i=0;i<S.meds.length;i++){if(S.meds[i].id===simMed)m=S.meds[i];}
  if(!m)return;
  if(session)return;
  startSession(m,nowHHMM(),dayKey(new Date())+'|'+m.id+'|sim'+Date.now(),true);
}
function tick(){
  var now=Date.now(),dt=(now-lastTs)/1000;lastTs=now;
  if(!session){checkSchedule();return;}
  session.minute+=dt*(S.demo?0.5:1/60);
  if(session.minute>=LIMIT){finish(decide(session,true));return;}
  var lv=Math.min(4,Math.floor(session.minute/STEP)+1);
  if(lv!==session.level){
    session.level=lv;
    var c=byColor(session.med.color);
    log('triz/paciente/alarm/set',{event_id:session.id,color:c.hex,pattern:c.blinks,level:lv});
    if(lv===3&&!session.warned){session.warned=true;addAlert('aviso',session.med.nombre+' de las '+clock(session.hhmm)+': aún no responde a la alarma (nivel 3 de 4).');save();}
    vib([400,150,400]);render();
  }else{updateLive();}
}
function openLid(colorId){
  if(!session)return;
  var c=byColor(colorId),slot=0,i;
  for(i=0;i<S.meds.length;i++){if(S.meds[i].color===colorId)slot=i+1;}
  log('triz/paciente/box/lid',{event_id:session.id,compartment:slot,opened_at:new Date().toTimeString().slice(0,8)});
  openUntil[colorId]=Date.now()+1600;
  setTimeout(function(){render();},1700);
  if(colorId===session.med.color){
    if(!session.lidOk){session.lidOk=true;session.quiet=true;}
    var r=decide(session,false);
    if(r){finish(r);return;}
  }else{
    if(!session.lidWrong){
      session.lidWrong=true;
      addAlert('urgente','Se abrió la tapa '+c.name.toLowerCase()+' en lugar de la '+byColor(session.med.color).name.toLowerCase()+' ('+session.med.nombre+').');
      save();
    }
    wrongFlash=Date.now()+3000;
    setTimeout(function(){render();},3100);
  }
  render();
}
function confirmDose(src){
  if(!session)return;
  session.confirmed=true;
  if(src==='band')log('triz/paciente/band/confirm',{event_id:session.id,pressed_at:new Date().toTimeString().slice(0,8)});
  else log('pantalla',{event_id:session.id,confirmado:true},'cloud');
  var r=decide(session,false);
  if(r)finish(r);
}
function finish(r){
  var s=session,m=s.med,c=byColor(m.color),hm=clock(s.hhmm);
  S.events[s.key]={key:s.key,date:dayKey(new Date()),hhmm:s.hhmm,medId:m.id,nombre:m.nombre,dosis:m.dosis,color:m.color,
    estado:r.estado,confianza:r.confianza,nota:r.nota,ts:Date.now(),sim:s.sim};
  log('nube',{event_id:s.id,estado:r.estado,confianza:r.confianza},'cloud');
  if(r.stock){
    var med=null,i;
    for(i=0;i<S.meds.length;i++){if(S.meds[i].id===m.id)med=S.meds[i];}
    if(med){
      med.stock=Math.max(0,med.stock-med.porToma);
      if(med.stock<=med.umbral){
        var d=daysLeft(med);
        addAlert('aviso','Reponer '+med.nombre+': quedan '+med.stock+' y alcanzan para '+d+(d===1?' día.':' días.'));
      }
    }
  }
  if(r.estado==='omitida')addAlert('urgente','Dosis omitida: '+m.nombre+' '+m.dosis+' de las '+hm+' (color '+c.name.toLowerCase()+').');
  else if(r.estado==='error_color')addAlert('urgente','Dosis sin tomar: '+m.nombre+' de las '+hm+'. Se abrió una tapa que no era.');
  else if(r.revision)addAlert('informativo',m.nombre+' de las '+hm+': confirmada sin abrir el pastillero. Conviene revisarla.');
  else if(r.confianza==='baja')addAlert('informativo',m.nombre+' de las '+hm+': se abrió la tapa pero no hubo confirmación.');
  if(s.warned&&r.estado==='tomada')addAlert('informativo',m.nombre+' de las '+hm+': ya respondió a la alarma.');
  lastResult={estado:r.estado,color:c,until:Date.now()+12000};
  session=null;releaseWake();clearInterval(sndTimer);save();render(true);
  setTimeout(function(){render();},12200);
}

/* ---------- Dibujo y eventos ---------- */
function updateLive(){
  var el=document.getElementById('liveText');
  if(!el||!session)return;
  var left=Math.max(0,Math.ceil(LIMIT-session.minute));
  el.textContent='Quedan '+left+(left===1?' minuto':' minutos')+(S.demo?' (tiempo de demostración)':'');
}
function render(force){
  var act=document.activeElement;
  if(!force&&view==='cuidador'&&act&&act.closest&&act.closest('#medForm')){pendingRender=true;return;}
  var links=document.querySelectorAll('nav a'),i;
  for(i=0;i<links.length;i++){
    if(links[i].getAttribute('href')==='#'+view)links[i].setAttribute('aria-current','page');
    else links[i].removeAttribute('aria-current');
  }
  $('#view').innerHTML=view==='cuidador'?vCuidador():view==='equipos'?vEquipos():vAdulto();
  updateLive();
}
function route(){
  var h=location.hash.replace('#','');
  view=(h==='cuidador'||h==='equipos')?h:'adulto';
  render(true);
}
function addMed(fd){
  function say(t){formNote=t;var m=document.getElementById('formMsg');if(m){m.textContent=t;m.className='msg';}}
  var nombre=String(fd.get('nombre')||'').trim(),dosis=String(fd.get('dosis')||'').trim();
  var stock=parseInt(fd.get('stock'),10),porToma=parseInt(fd.get('porToma'),10),umbral=parseInt(fd.get('umbral'),10);
  if(!nombre||!dosis){say('Escriba el nombre y la dosis.');return;}
  if(!(stock>=0)||!(porToma>=1)){say('Revise la cantidad disponible y las pastillas por toma.');return;}
  var hs=String(fd.get('horarios')||'').split(/[\s,;]+/).filter(Boolean),re=/^([01]?\d|2[0-3]):([0-5]\d)$/;
  if(!hs.length||hs.some(function(h){return !re.test(h);})){say('Escriba los horarios así: 08:00, 20:00.');return;}
  var seen={},horarios=[];
  hs.forEach(function(h){var p=h.split(':'),n=pad(+p[0])+':'+p[1];if(!seen[n]){seen[n]=1;horarios.push(n);}});
  horarios.sort();
  var used={};S.meds.forEach(function(m){used[m.color]=true;});
  var color=fd.get('color');
  if(!color||color==='auto'){
    var free=null,i;
    for(i=0;i<COLORS.length;i++){if(!used[COLORS[i].id]){free=COLORS[i];break;}}
    if(!free){say('Ya usa los ocho colores. Elimine un medicamento para liberar uno.');return;}
    color=free.id;
  }else if(used[color]){say('Ese color ya está en uso.');return;}
  S.meds.push({id:'m'+Date.now().toString(36),nombre:nombre,dosis:dosis,color:color,stock:stock,porToma:porToma,umbral:isNaN(umbral)?7:umbral,horarios:horarios});
  if(!simMed)simMed=S.meds[0].id;
  formNote='Medicamento agregado.';
  save();render(true);
}
function manualMark(key,taken){
  var d=null;
  todayDoses().forEach(function(x){if(x.key===key)d=x;});
  if(!d||(session&&session.key===key))return;
  var prev=d.ev,m=d.med;
  S.events[key]={key:key,date:dayKey(new Date()),hhmm:d.hhmm,medId:m.id,nombre:m.nombre,dosis:m.dosis,color:m.color,
    estado:taken?'tomada':'omitida',confianza:'alta',nota:taken?'Confirmado por el cuidador':'El cuidador confirmó que no la tomó',ts:Date.now(),manual:true};
  if(taken&&!(prev&&prev.estado==='tomada')){
    m.stock=Math.max(0,m.stock-m.porToma);
    if(m.stock<=m.umbral){var n=daysLeft(m);addAlert('aviso','Reponer '+m.nombre+': quedan '+m.stock+' y alcanzan para '+n+(n===1?' día.':' días.'));}
  }
  save();render(true);
}
function removeMed(id){
  S.meds=S.meds.filter(function(m){return m.id!==id;});
  if(session&&session.med.id===id){session=null;releaseWake();clearInterval(sndTimer);}
  if(simMed===id)simMed=S.meds.length?S.meds[0].id:'';
  save();
}

document.addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('[data-act]'):null;
  if(!b||b.disabled)return;
  var a=b.getAttribute('data-act');
  if(a==='sound'){enableSound();render(true);}
  else if(a==='confirm'){confirmDose('screen');}
  else if(a==='band'){confirmDose('band');}
  else if(a==='lid'){openLid(b.getAttribute('data-c'));}
  else if(a==='sim'){simulate();}
  else if(a==='manual'){manualMark(b.getAttribute('data-key'),b.getAttribute('data-v')==='si');}
  else if(a==='delmed'){
    var id=b.getAttribute('data-id');
    if(armDel===id){armDel=null;removeMed(id);render(true);}
    else{armDel=id;render(true);setTimeout(function(){if(armDel===id){armDel=null;render();}},4000);}
  }
  else if(a==='clearalerts'){S.alerts=[];save();render(true);}
  else if(a==='reset'){S=seed();session=null;lastResult=null;releaseWake();simMed=S.meds[0].id;save();render(true);}
  else if(a==='blank'){S={meds:[],events:{},alerts:[],demo:S.demo,seeded:false};session=null;lastResult=null;releaseWake();simMed='';save();render(true);}
});
document.addEventListener('submit',function(e){
  if(e.target&&e.target.id==='medForm'){e.preventDefault();addMed(new FormData(e.target));}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='simMed')simMed=t.value;
  else if(t.id==='demo'){S.demo=t.checked;save();render(true);}
});
document.addEventListener('focusout',function(e){
  if(pendingRender&&!(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('#medForm'))){
    pendingRender=false;setTimeout(function(){render();},0);
  }
});
window.addEventListener('hashchange',route);

route();
setInterval(tick,250);
})();
</script>

</body></html>
